name: clang-tidy

on:
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: clang-tidy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLANG_VERSION: "23"
  # First run: read the count in the summary, then set the limit just above it.
  FULL_WARNING_LIMIT: "99999"
  # In a PR, only changed files are analysed: no new warnings allowed.
  PR_WARNING_LIMIT: "0"
  COMMON_ARGS: "-DBUILD_DESKTOP_UI:BOOL=ON -DBUILD_TESTS:BOOL=ON -DBUILD_DIAGNOSTICS=OFF"

jobs:
  wait-image-docker-linux:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      image: ${{ steps.wait.outputs.image }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/build-linux"
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "image=$IMAGE:ci" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TAG="ci-$(echo "$HEAD_SHA" | cut -c1-7)"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in $(seq 1 60); do
            if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
              echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 60
          done
          echo "::error::$IMAGE:$TAG absent after 60 min (build docker failed ?)"; exit 1
  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      pull-requests: write # Required for cpp-linter PR reviews / comments

    needs: wait-image-docker-linux
    container:
      image: ${{ needs.wait-image-docker-linux.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      # ====================================================================
      # Checkout
      # ====================================================================
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ====================================================================
      # Toolchain: clang + clang-tidy (compile_commands.json is produced by
      # clang, so clang-tidy never sees GCC-only flags)
      # ====================================================================
      - name: Toolchain versions
        run: clang-tidy-23 --version
      

      # ====================================================================
      # set BUILD_DIR path
      # ====================================================================
      - name: Resolve build directory from preset
        run: |
          RAW=$(jq -r '.configurePresets[] | select(.name == "debug-ninja") | .binaryDir // empty' CMakePresets.json)
          # Expansion des macros CMake éventuelles (${sourceDir}, ...)
          BUILD_DIR=$(python3 -c 'import os,sys; print(os.path.expandvars(sys.argv[1].replace("${sourceDir}", os.getcwd())))' "$RAW")
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "build dir: $BUILD_DIR"

      # ====================================================================
      # Configure + build (generates moc / rcc / qml sources that
      # clang-tidy needs in order to parse the project)
      # ====================================================================
      - name: Configure and generate sources
        run: |
          cmake --preset debug-ninja ${{ env.COMMON_ARGS }} \
            -DCMAKE_C_COMPILER=clang-${CLANG_VERSION} \
            -DCMAKE_CXX_COMPILER=clang++-${CLANG_VERSION} \
            -DCMAKE_PREFIX_PATH="/opt/qt/6.10.2/gcc_64;/opt/oiio;/opt/exiv2" \
            -DCMAKE_GLOBAL_AUTOGEN_TARGET=ON
          cmake --build --preset debug-ninja --target autogen

      # ====================================================================
      # Select files: PR -> changed .cpp files; push -> everything.
      # A changed header triggers a full analysis (headers are only reached
      # through the .cpp files that include them).
      # ====================================================================
      - name: Select files to analyse
        id: select
        run: |
          MODE=full
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            CHANGED=$(git diff --name-only --diff-filter=ACMR "${BASE}...HEAD")
            if echo "${CHANGED}" | grep -qE '\.(h|hpp|hxx)$|CMakeLists\.txt$|\.cmake$|\.clang-tidy$'; then
              MODE=full
            else
              MODE=changed
            fi
          fi

          if [ "${MODE}" = "changed" ]; then
            echo "${CHANGED}" | grep -E '\.(cpp|cc|cxx)$' > /tmp/candidates.txt || true
          else
            git ls-files '*.cpp' '*.cc' '*.cxx' > /tmp/candidates.txt
          fi

          # Keep only first-party files that exist in the compilation database
          jq -r '.[].file' "${BUILD_DIR}/compile_commands.json" | sort -u > /tmp/in_db.txt
          grep -Ev '^(build|third_party|extern|vcpkg_installed|\.github)/' /tmp/candidates.txt \
            | sed "s|^|${GITHUB_WORKSPACE}/|" | sort -u > /tmp/wanted.txt || true
          comm -12 /tmp/wanted.txt /tmp/in_db.txt > /tmp/files.txt

          COUNT=$(wc -l < /tmp/files.txt)
          echo "Mode: ${MODE}, files to analyse: ${COUNT}"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${MODE}" = "full" ]; then
            echo "limit=${FULL_WARNING_LIMIT}" >> "$GITHUB_OUTPUT"
          else
            echo "limit=${PR_WARNING_LIMIT}" >> "$GITHUB_OUTPUT"
          fi

      # ====================================================================
      # Run clang-tidy
      # ====================================================================
      - name: Run clang-tidy
        if: steps.select.outputs.count != '0'
        run: |
          run-clang-tidy-${CLANG_VERSION} \
            -clang-tidy-binary "$(command -v clang-tidy-${CLANG_VERSION})" \
            -p "${BUILD_DIR}" \
            -quiet \
            -j "$(nproc)" \
            $(cat /tmp/files.txt) \
            2>&1 | tee clang-tidy.log || true

      # ====================================================================
      # Run cpp-linter (for clang-format & advanced formatting review)
      # ====================================================================
      - name: Run cpp-linter action
        uses: cpp-linter/cpp-linter-action@71cf8e84d4876ee304e3330f314df15b9da49c67 # v2
        id: cpp_linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '${{ env.CLANG_VERSION }}'
          style: 'file'
          tidy-checks: ''
          format-review: true

      # ====================================================================
      # Analyse the log: unique warnings + top checks in the job summary
      # ====================================================================
      - name: Analyse clang-tidy output
        id: analyze
        run: |
          touch clang-tidy.log
          grep -E '^/.*: (warning|error): .*\[[A-Za-z0-9.,_-]+\]$' clang-tidy.log \
            | grep -Ev '/(build|_deps|third_party|vcpkg_installed)/' \
            | sort -u > warnings.txt || true
          COUNT=$(wc -l < warnings.txt)
          echo "warning_count=${COUNT}" >> "$GITHUB_OUTPUT"

          {
            echo "## clang-tidy (${{ steps.select.outputs.mode }} mode)"
            echo ""
            echo "- Files analysed: ${{ steps.select.outputs.count }}"
            echo "- Unique warnings: **${COUNT}** (limit: ${{ steps.select.outputs.limit }})"
            echo ""
            echo "### Top checks"
            echo '```'
            grep -oE '\[[A-Za-z0-9.,_-]+\]$' warnings.txt | sort | uniq -c | sort -rn | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          head -n 50 warnings.txt | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            ln=$(echo "$line" | cut -d: -f2)
            msg=$(echo "$line" | cut -d: -f5-)
            echo "::warning file=${file#${GITHUB_WORKSPACE}/},line=${ln}::${msg}"
          done

      - name: Upload logs and warnings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clang-tidy-report
          path: |
            clang-tidy.log
            warnings.txt
          if-no-files-found: warn

      # ====================================================================
      # Gate (Fail if limits are exceeded)
      # ====================================================================
      - name: Check warning limit
        env:
          COUNT: ${{ steps.analyze.outputs.warning_count }}
          LIMIT: ${{ steps.select.outputs.limit }}
        run: |
          echo "clang-tidy: ${COUNT} unique warning(s), limit ${LIMIT}"
          if [ "${COUNT}" -gt "${LIMIT}" ]; then
            echo "::error::${COUNT} warning(s) exceed the limit of ${LIMIT}. See the 'clang-tidy-report' artifact."
            exit 1
          fi

      - name: Fail on format errors
        if: steps.cpp_linter.outputs.checks-failed > 0
        continue-on-error: true
        run: |
          echo "::warning::Formatting or lint issues detected by cpp-linter."