name: Docker Linux image

on:
  workflow_call:
    outputs:
      image_uri:
        value: ${{ jobs.build-docker.outputs.image_uri }}

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_uri: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/build-linux
          tags: |
            type=raw,value=ci
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/linux/Dockerfile
          push: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
