# .github/workflows/ci-linux.yml
# Do not modify the name directly.
name: CI Linux (Ninja + GCC)

on:
  pull_request:
    branches: ["main", "develop"]

  workflow_dispatch:

env:
  CMAKE_GENERATOR: Ninja
  COMMON_ARGS: "-DBUILD_DESKTOP_UI:BOOL=ON -DBUILD_TESTS:BOOL=ON -DBUILD_DIAGNOSTICS=OFF"

jobs:
  # ====================================================================
  # Wait the image docker
  # ====================================================================
  wait-image-docker-linux:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.wait.outputs.image }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/build-linux"
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "image=$IMAGE:ci" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TAG="ci-$(echo "$HEAD_SHA" | cut -c1-7)"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in $(seq 1 60); do
            if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
              echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 60
          done
          echo "::error::$IMAGE:$TAG absent after 60 min (build docker failed ?)"; exit 1

  # ====================================================================
  # Build and Test the Project
  # ====================================================================
  build:
    needs: wait-image-docker-linux
    runs-on: ubuntu-latest

    container: ${{ needs.wait-image-docker-linux.outputs.image }}
    strategy:
      matrix:
        build-type: [Release, Debug]
        include:
          - build-type: Release
            preset: release-ninja
          - build-type: Debug
            preset: debug-ninja

    steps:
      # ====================================================================
      # Checkout
      # ====================================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # ====================================================================
      # Configure cmake environment
      # ====================================================================
      - name: Configure CMake Project
        id: configure
        run: |
          cmake \
          --preset ${{ matrix.preset }} ${{ env.COMMON_ARGS }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DCMAKE_PREFIX_PATH="/opt/qt/6.10.2/gcc_64;/opt/oiio;/opt/exiv2"

        shell: bash

      # ====================================================================
      # Build
      # ====================================================================
      - name: Build Project
        run: |
           cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.build-type }} --parallel $(nproc)
        shell: bash

      # ====================================================================
      # Test with Sanitizers
      # ====================================================================
      - name: Run Tests
        if: ${{ always() && steps.configure.outcome == 'success' }}
        run: |
          ctest --preset ${{ matrix.preset }} \
            --output-on-failure -C ${{ matrix.build-type }} \
            --output-junit "$GITHUB_WORKSPACE/test-results-${{ matrix.preset }}.xml"
        shell: bash

      # ====================================================================
      # Upload test results (JUnit)
      # ====================================================================
      - name: Upload test results
        if: (!cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.preset }}
          path: test-results-${{ matrix.preset }}.xml
          if-no-files-found: warn
          retention-days: 1

      # ====================================================================
      # Upload build artifacts
      # ====================================================================
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-${{ matrix.build-type }}
          path: |
            build/${{ matrix.preset }}/CaptureMoment
          retention-days: 7
          if-no-files-found: warn



#=====================================================================
# Publish Test Results
#=====================================================================
  publish-tests:
    needs: build
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/publish-tests.yml
    with:
      name: Linux